name: AI evals

# Calls OpenAI (and later TypeSafe Jev), so it costs a little: nightly, when an AI file changes, or by hand.
on:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - lib/ai.ts
      - lib/ai-prompts.ts
      - app/api/explain/**
      - evals/**
      - .github/workflows/ai-evals.yml
  pull_request:
    paths:
      - lib/ai.ts
      - lib/ai-prompts.ts
      - app/api/explain/**
      - evals/**
      - .github/workflows/ai-evals.yml

concurrency:
  group: ai-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendors:
    # Secrets are not available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails when false matches exceed 1 in 50 pairs; accuracy is printed alongside.
      - run: npm run eval:vendors
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-eval
          path: evals/vendors/results.json
          if-no-files-found: ignore

  # explain job (OpenAI explanations judged by Jev, needs TYPESAFE_API_KEY) is added with part 3
