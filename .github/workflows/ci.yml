name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Production build on Linux: catches build and prerender errors that tsc and the tests cannot.
      - run: npm run build
      # Rules only: no API keys, no network, free. Fails if precision or recall drops below the thresholds in evals/detection/run.ts.
      - run: npm run eval:detection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detection-eval
          path: evals/detection/results.json
          if-no-files-found: ignore
